<?xml version="1.0" encoding="UTF-8"?>
<!--
  The basedpython mark: a b above a waterline whose reflection is a p, since a .by file is written to
  be lowered to a .py. Built from strokes rather than <text>, so it does not depend on which fonts the
  renderer finds.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
  <rect x="2" y="2" width="36" height="36" rx="8" fill="#14213A"/>
  <g stroke-width="3.2" stroke-linecap="round">
    <g stroke="#FFD43B"><path d="M15.4 7.2V18"/><circle cx="20.2" cy="14" r="4"/></g>
    <g stroke="#5A9BE0" transform="matrix(1 0 0 -1 0 40)"><path d="M15.4 7.2V18"/><circle cx="20.2" cy="14" r="4"/></g>
  </g>
</svg>
