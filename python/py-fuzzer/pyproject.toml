[project]
name = "py-fuzzer"
version = "0.0.0"
description = "Run Ruff or ty on randomly generated Python source files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pysource-codegen>=0.6.0",
    "pysource-minimize>=0.8.0",
    "rich-argparse>=1.7.0",
    "ruff>=0.11.9",
    "termcolor>=3.1.0",
]

[project.scripts]
fuzz = "fuzz:main"

[build-system]
requires = ["flit-core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[dependency-groups]
dev = ["mypy", "ruff", "ty"]

[tool.flit.module]
name = "fuzz"

[tool.mypy]
files = "fuzz.py"
pretty = true
strict = true
warn_unreachable = true
local_partial_types = true
enable_error_code = "ignore-without-code,redundant-expr,truthy-bool"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "error"
# mypy checks this project too, in strict mode, where `no-untyped-def` requires
# the `-> None` ty reads off the body. mypy wins here — it cannot infer it
redundant-return-annotation = "ignore"

[tool.ruff]
fix = true
preview = true

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "ARG",
    "E",
    "F",
    "B",
    "B9",
    "C4",
    "SIM",
    "I",
    "UP",
    "PIE",
    "PGH",
    "PYI",
    "RUF",
]
ignore = [
    # only relevant if you run a script with `python -0`,
    "B011",
    # These are enforced by, or incompatible with, the ruff formatter:
    "E203",
    "E501",
]
unfixable = [
    "F841",   # unused variable. ruff keeps the call, but mostly it's best to get rid of it all
    "F601",   # automatic fix might obscure issue
    "F602",   # automatic fix might obscure issue
    "B018",   # automatic fix might obscure issue
    "RUF017", # Ruff's fix is faster, but I prefer using itertools.chain_from_iterable
]

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false

[tool.uv]
no-build = true
no-binary-package = ["py-fuzzer"]
# Pin the isolated build environment for source-build exceptions.
build-constraint-dependencies = ["flit-core==3.12.0"]
exclude-newer = "P7D"

# these files come from upstream ruff, where a call written for its effect alone is
# ordinary style. writing the discard out at each site would put a conflict in every
# one of them on the next upstream sync, so the rule is off for them rather than for
# the project — code of our own here is still checked
[[tool.ty.overrides]]
include = ["fuzz.py"]

[tool.ty.overrides.rules]
unused-return-value = "ignore"
