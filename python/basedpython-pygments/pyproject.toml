[project]
name = "basedpython-pygments"
version = "0.0.0"
description = "a pygments lexer for basedpython, used to highlight `by` code in the docs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pygments>=2.19"]

# pygments discovers third-party lexers through this entry point group, so
# installing the package is all it takes for ```by``` fences to highlight
[project.entry-points."pygments.lexers"]
basedpython = "basedpython_pygments:BasedPythonLexer"

# flit-core rather than another backend: the workspace pins build backends by hash
# (`build-constraint-dependencies` in the root `pyproject.toml`), and it is already
# pinned there. it finds the `basedpython_pygments` module from the project name
[build-system]
requires = ["flit-core>=4,<5"]
build-backend = "flit_core.buildapi"

# rebuild whenever the lexer changes: installed from a path, the package is otherwise
# served from uv's build cache, and a check against it would check a stale copy
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "basedpython_pygments/**/*.py" }]
