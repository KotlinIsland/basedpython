[project]
name = "ty_benchmark"
version = "0.0.1"
description = "Package for running end-to-end ty benchmarks"
requires-python = ">=3.14"
dependencies = [
    # mypy is missing here because we need to install it into the project's virtual environment
    # for plugins to work. See `Venv.install`.
    # Pyright is missing because we install it with `npm` to avoid measuring the overhead
    # of the Python wrapper script (that lazily installs Pyright).
    "mslex>=1.3.0",
    "pyrefly==1.2.0",
    "pytest-benchmark>=4.0.0",
    "pytest>=8.0.0",
    "pygls>=2.0.0",
    "lsprotocol>=2025.0.0",
]

[project.scripts]
benchmark = "benchmark.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark"]

[tool.ruff.lint]
ignore = [
    "E501", # We use ruff format
]

[tool.ty.rules]
# the `benchmark` fixture comes from pytest-benchmark through a `pytest11` entry
# point, and plugin fixtures are not discovered yet — which is why this rule is
# off by default. the strict preset turns it on, so it is turned back off here
unknown-fixture = "ignore"
possibly-unresolved-reference = "error"
division-by-zero = "error"
unused-ignore-comment = "error"

# these files come from upstream ruff, where a call written for its effect alone is
# ordinary style. writing the discard out at each site would put a conflict in every
# one of them on the next upstream sync, so the rule is off for them rather than for
# the project — code of our own here is still checked
[[tool.ty.overrides]]
include = ["src/benchmark/test_lsp_diagnostics.py"]

[tool.ty.overrides.rules]
unused-return-value = "ignore"
