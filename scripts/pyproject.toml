[project]
name = "scripts"
version = "0.0.1"
dependencies = [
    "stdlibs",
    "tqdm",
    "mdformat",
    "pyyaml",
    "mypy-primer",
    "httpx",
    # `check_by_lexer.py` exercises the lexer in `python/basedpython-pygments`.
    # only `pygments` is imported — the lexer itself is resolved through its
    # entry point at runtime, so it is not a dependency of this project
    "pygments",
]
requires-python = ">=3.12"

[dependency-groups]
# pytest runs `test_build_backend.py`; it is not what the file is written
# against, but the checker types its fixtures from pytest's own package
dev = ["pytest"]

[tool.black]
line-length = 88

[tool.ruff]
extend = "../pyproject.toml"

[tool.ty.environment]
# `test_build_backend.py` tests `basedpython.build`, the PEP 517 backend that
# ships in the `basedpython` wheel. it puts `../python` on `sys.path` to reach it,
# and this is the same thing said to the checker
root = [".", "../python"]

[tool.ty.src]
# `ty_benchmark` is a standalone project with its own pyproject.toml files, search paths, etc.
# `native-bench/programs` are the benchmark's inputs rather than its tooling: each one is written
# to measure a particular shape, so what the checker would ask for — an `@override`, a narrower
# annotation — would change the program being measured
exclude = ["./ty_benchmark", "./native-bench/programs"]

[tool.uv.sources]
mypy-primer = { git = "https://github.com/hauntsaninja/mypy_primer" }

[tool.ty.rules]
possibly-unresolved-reference = "error"
division-by-zero = "error"
unused-ignore-comment = "error"

# these files come from upstream ruff, where a call written for its effect alone is
# ordinary style. writing the discard out at each site would put a conflict in every
# one of them on the next upstream sync, so the rule is off for them rather than for
# the project — code of our own here is still checked
[[tool.ty.overrides]]
include = ["build_ruff_pgo.py", "generate_builtin_modules.py", "generate_mkdocs.py", "setup-crates-io-publish.py"]

[tool.ty.overrides.rules]
unused-return-value = "ignore"
