# Define serial test group for running tests sequentially.
[test-groups]
serial = { max-threads = 1 }

# Run ty file watching tests sequentially to avoid race conditions.
[[profile.default.overrides]]
filter = 'binary(file_watching)'
test-group = 'serial'

[profile.ci]
# Print out output for failing tests as soon as they fail, and also at the end
# of the run (for easy scrollability).
failure-output = "immediate-final"
# Do not cancel the test run on the first failure.
fail-fast = false

status-level = "skip"

# Mark tests that take longer than 1s as slow.
# Terminate after 60s as a stop-gap measure to terminate on deadlock.
slow-timeout =  { period = "1s", terminate-after = 60 }

# Show slow jobs in the final summary
final-status-level = "slow"

# The divergence harness runs its blocks in parallel, but on a 2-core CI runner
# it still spends up to a minute or two spawning ~200 transpile/python subprocess
# pairs (plus a possible one-off uv python download), so exempt it from the
# aggressive 60s deadlock cutoff that would otherwise kill it mid-run.
#
# The budget grows with every basedpython feature that adds mdtest blocks — it was
# already at 152s of the previous 180s ceiling — so the ceiling is deliberately
# well clear of the current cost rather than just above it. `type def` blocks are
# the most expensive kind, because transpiling one evaluates its type functions,
# and each evaluation spawns an interpreter.
#
# It had drifted back to "just above it": 279.6s on main and 284.0s after the
# 2026-08-13 upstream merge, against a 360s ceiling. Runner speed varies by more
# than the 21% of headroom that left, and the same commit timed out at 360s on two
# runs out of three while passing at 284s on the third. 10 minutes puts the cost
# back under half the ceiling and still catches a deadlock.
#
# And it drifted back again, the same way. On windows the harness measured 561.1s
# on main against the 600s ceiling — 6.5% of headroom — and basedpython-ui's
# mdtests, which took the runnable corpus from 1086 blocks to 1137 (+4.7%), were
# enough to exceed it. The cost is a transpile/python subprocess pair per block,
# and windows spawns processes far more slowly than linux, so windows is where the
# ceiling binds first. 20 minutes puts the cost back under half, as before.
#
# The harness already parallelises internally over a work-stealing pool, so this
# is not a serialisation problem: it is that the corpus only ever grows while a CI
# runner has two cores. Cutting the per-block cost is the lever, and the harness
# now takes the cheapest one — a block naming a module the interpreter does not
# have is dropped before it is transpiled rather than after, which measured 46.3s
# to 40.4s (12.7%) locally. That more than pays for the blocks added here, but the
# ceiling is raised anyway: 561.1s of 600s was already too close before any of
# them. The next lever, if this drifts a fourth time, is calling the transpiler
# in-process instead of spawning `by` per block, which would remove half the
# process spawns outright.
[[profile.ci.overrides]]
filter = 'test(clean_mdtest_blocks_run)'
slow-timeout = { period = "60s", terminate-after = 20 }

# External-dependency mdtests provision a real virtualenv with `uv` (a network
# install of the framework plus its stubs) before type-checking, so on the fork's
# slow runners a single heavy file (django, pydantic) approaches or exceeds the
# aggressive 60s deadlock cutoff. Like the divergence harness, exempt them: the
# 60s limit is a deadlock stop-gap, not a runtime budget for real installs.
[[profile.ci.overrides]]
filter = 'test(mdtest::external/)'
slow-timeout = { period = "60s", terminate-after = 3 }

# The linter corpus shards type-check every fixture ruff's linter owns, in an
# unoptimized build. `f` alone is 611 files — every `flake8_*` directory — and
# a single letter is as fine as the sharding gets, so it cannot be split down.
# It measured 35s on a fast linux runner and 59.6s on windows against the 60s
# cutoff, which made the cutoff a coin toss rather than a deadlock guard: it
# fired on 2026-08-09 for a run whose *every* test was ~2x slower (631s of
# tests on main, 1345s on the same commit range), not for anything the code did.
# Same reasoning as the two above — the limit is a stop-gap for deadlock, and
# 3 minutes still catches one.
[[profile.ci.overrides]]
filter = 'test(linter_no_panic)'
slow-timeout = { period = "60s", terminate-after = 3 }

# The native backend's stdlib corpus compiles a real module end to end — lowering it,
# emitting C, and running the C compiler and linker over it — in an unoptimized build.
# A module to a test keeps each one attributable and lets them overlap, but even the
# small ones take tens of seconds and `dataclasses` takes minutes, so the 60s cutoff
# would kill the corpus outright: that is what it did on 2026-08-10, at 60.188s, for a
# test that passes in 810s locally. Same reasoning as the three above — the limit is a
# stop-gap for deadlock, not a runtime budget, and 20 minutes still catches one.
[[profile.ci.overrides]]
filter = 'test(compiles_without_a_hard_failure)'
slow-timeout = { period = "60s", terminate-after = 20 }
