# Define serial test group for running tests sequentially.
[test-groups]
serial = { max-threads = 1 }

# Run ty file watching tests sequentially to avoid race conditions.
[[profile.default.overrides]]
filter = 'binary(file_watching)'
test-group = 'serial'

# the transpiler's runtime tests transpile for the interpreter they run on. a few
# programs need a newer python than the one found, or more of it —
# `typing_extensions`, the `regex` package — which a machine often does not have.
# each says which interpreter it ran on, or that it found none and ran nothing, and
# a passing test's output is otherwise hidden, so a skip would read as a pass
[[profile.default.overrides]]
filter = 'package(by_transforms) & binary(/_runtime$/)'
success-output = "final"

[profile.ci]
# Print out output for failing tests as soon as they fail, and also at the end
# of the run (for easy scrollability).
failure-output = "immediate-final"
# Do not cancel the test run on the first failure.
fail-fast = false

status-level = "skip"

# Mark tests that take longer than 1s as slow.
# Terminate after 60s as a stop-gap measure to terminate on deadlock.
slow-timeout =  { period = "1s", terminate-after = 60 }

# Show slow jobs in the final summary
final-status-level = "slow"

# The divergence harness transpiles and runs every checker-clean `by` block in the
# mdtests, and checks each with its unused imports removed. A block costs a
# `by transpile`, a `by check --fix` and a python run, and the transpile and the
# check each build a database and infer what the block needs of the builtins from
# scratch: that, not starting the processes, is the cost, and it grows with every
# basedpython feature that adds mdtest blocks.
#
# The corpus is spread over eight shards by `shard_of` in
# `crates/ty/tests/mdtest_divergence.rs`, each a test of its own, so the limit holds
# one shard rather than the whole corpus. Even so a shard is minutes of work on a
# two-core runner, and windows spawns processes far more slowly than linux, so the
# shards are exempt from the 60s deadlock cutoff. If a shard approaches this limit,
# the lever is more shards, not a higher limit.
[[profile.ci.overrides]]
filter = 'test(clean_mdtest_blocks_run)'
slow-timeout = { period = "60s", terminate-after = 20 }

# External-dependency mdtests provision a real virtualenv with `uv` (a network
# install of the framework plus its stubs) before type-checking, so on the fork's
# slow runners a single heavy file (django, pydantic) approaches or exceeds the
# aggressive 60s deadlock cutoff. Like the divergence harness, exempt them: the
# 60s limit is a deadlock stop-gap, not a runtime budget for real installs.
[[profile.ci.overrides]]
filter = 'test(mdtest::external/)'
slow-timeout = { period = "60s", terminate-after = 3 }

# The linter corpus shards type-check every fixture ruff's linter owns, in an
# unoptimized build. `f` alone is 611 files — every `flake8_*` directory — and
# a single letter is as fine as the sharding gets, so it cannot be split down.
# It measured 35s on a fast linux runner and 59.6s on windows against the 60s
# cutoff, which made the cutoff a coin toss rather than a deadlock guard: it
# fired on 2026-08-09 for a run whose *every* test was ~2x slower (631s of
# tests on main, 1345s on the same commit range), not for anything the code did.
# Same reasoning as the two above — the limit is a stop-gap for deadlock, and
# 3 minutes still catches one.
[[profile.ci.overrides]]
filter = 'test(linter_no_panic)'
slow-timeout = { period = "60s", terminate-after = 3 }

# The native backend's stdlib corpus compiles a real module end to end — lowering it,
# emitting C, and running the C compiler and linker over it — in an unoptimized build.
# A module to a test keeps each one attributable and lets them overlap, but even the
# small ones take tens of seconds and `dataclasses` takes minutes, so the 60s cutoff
# would kill the corpus outright: that is what it did on 2026-08-10, at 60.188s, for a
# test that passes in 810s locally. Same reasoning as the three above — the limit is a
# stop-gap for deadlock, not a runtime budget, and 20 minutes still catches one.
[[profile.ci.overrides]]
filter = 'test(compiles_without_a_hard_failure)'
slow-timeout = { period = "60s", terminate-after = 20 }
