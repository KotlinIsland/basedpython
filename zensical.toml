[project]
site_name = "basedpython"
site_description = "a python-like language that transpiles to pure python"
site_author = "KotlinIsland"
site_url = "https://kotlinisland.github.io/basedpython/"
docs_dir = "docs/basedpython"
repo_url = "https://github.com/KotlinIsland/basedpython"
repo_name = "KotlinIsland/basedpython"
edit_uri = "edit/main/docs/basedpython"

extra_css = ["stylesheets/extra.css"]

[project.theme]
features = [
  # a click swaps the page in place instead of reloading the whole document,
  # and a hovered link is fetched before the click lands
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tracking",
  # the reference is deep, so say where you are and how to leave
  "navigation.path",
  "navigation.indexes",
  "navigation.footer",
  "navigation.top",
  "toc.follow",
  # every page is mostly code, so make it easy to take
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.action.edit",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/binary"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/KotlinIsland/basedpython"
name = "basedpython on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/basedpython/"
name = "basedpython on PyPI"

